services:
  db:
    image: postgres:16
    container_name: followwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-followwise}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in ../.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in ../.env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - followwise_pgdata:/var/lib/postgresql/data

volumes:
  followwise_pgdata:
