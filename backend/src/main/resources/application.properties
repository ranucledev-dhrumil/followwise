server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# App settings from .env.example
app.base-url=${APP_BASE_URL:}
app.default-timezone=${APP_DEFAULT_TIMEZONE:America/New_York}
app.scheduler-enabled=${SCHEDULER_ENABLED:true}
app.max-apps-per-workspace=${MAX_APPS_PER_WORKSPACE:5}
app.max-definition-versions-per-app=${MAX_DEFINITION_VERSIONS_PER_APP:200}
app.max-parties-per-app=${MAX_PARTIES_PER_APP:500}
app.max-records-per-app=${MAX_RECORDS_PER_APP:500}
app.max-ledger-entries-per-app=${MAX_LEDGER_ENTRIES_PER_APP:20000}

# Charge generation
app.charge.catchup-days=${CHARGE_CATCHUP_DAYS:35}
app.charge.lead-days=${CHARGE_LEAD_DAYS:14}
app.charge.generation-interval-minutes=${CHARGE_GENERATION_INTERVAL_MINUTES:60}
app.charge.max-generated-per-app-run=${MAX_GENERATED_PER_APP_RUN:500}

# Auth settings
jwt.secret=${JWT_SECRET:}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
auth.cookie-secure=${AUTH_COOKIE_SECURE:}

# Email settings
mail.transport=${MAIL_TRANSPORT:}
mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.from-name=${MAIL_FROM_NAME:FollowWise}
mail.from-address=${MAIL_FROM_ADDRESS:}
mail.reply-to=${MAIL_REPLY_TO:}
mail.daily-cap=${MAIL_DAILY_CAP:400}
