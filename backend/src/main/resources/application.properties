server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# App settings from .env.example
app.base-url=${APP_BASE_URL:}
app.default-timezone=${APP_DEFAULT_TIMEZONE:America/New_York}
app.scheduler-enabled=${SCHEDULER_ENABLED:true}

# Auth settings
jwt.secret=${JWT_SECRET:}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
