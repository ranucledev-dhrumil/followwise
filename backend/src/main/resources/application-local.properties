spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/followwise}
spring.datasource.username=${DATABASE_USER:followwise}
spring.datasource.password=${DATABASE_PASSWORD}

app.scheduler-enabled=${SCHEDULER_ENABLED:false}
mail.transport=${MAIL_TRANSPORT:log}
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
