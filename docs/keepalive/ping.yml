name: ping

permissions: {}

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 -o /dev/null "${{ vars.HEALTH_URL }}/health"
